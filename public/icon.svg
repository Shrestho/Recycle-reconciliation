<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad1)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6" />
  
  <!-- Outer recycling arrow circle -->
  <g transform="translate(256,256) scale(0.9) translate(-256,-256)">
    <!-- Node 1 Arrow (Top Right) -->
    <path d="M 256 80 A 176 176 0 0 1 408 230" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" />
    <polygon points="400,205 435,245 385,255" fill="#3b82f6" />
    
    <!-- Node 2 Arrow (Bottom Right to Left) -->
    <path d="M 390 310 A 176 176 0 0 1 150 380" fill="none" stroke="url(#glow)" stroke-width="26" stroke-linecap="round" />
    <polygon points="175,400 130,385 155,345" fill="#10b981" />

    <!-- Node 3 Arrow (Left to Top) -->
    <path d="M 115 280 A 176 176 0 0 1 210 100" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" />
    <polygon points="190,75 235,90 215,130" fill="#06b6d4" />
    
    <!-- Center ERP Balance / Layer Shield -->
    <g transform="translate(256, 256)">
      <!-- Central Core Balance Stack -->
      <rect x="-70" y="-60" width="140" height="24" rx="6" fill="#38bdf8" />
      <rect x="-85" y="-20" width="170" height="24" rx="6" fill="#818cf8" />
      <rect x="-100" y="20" width="200" height="24" rx="6" fill="#34d399" />
      <!-- Reconcile checkmark -->
      <circle cx="50" cy="50" r="32" fill="#10b981" stroke="#0f172a" stroke-width="6" />
      <path d="M 38 50 L 46 58 L 64 40" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
